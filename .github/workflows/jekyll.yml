name: Retire home Pages site
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Prepare empty site
        run: mkdir -p _site && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
